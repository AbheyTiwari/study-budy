<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap');

* { margin:0; padding:0; box-sizing:border-box; }

:root {
  --bg:      #08080f;
  --surface: #111120;
  --card:    #161628;
  --border:  #1e1e3a;
  --accent:  #e94560;
  --accent2: #7c3aed;
  --text:    #f0f0f8;
  --muted:   #4a4a6a;
  --green:   #22c55e;
}

html, body {
  height: 100vh;
  font-family: 'Inter', 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  border-radius: 16px;
  border: 1px solid var(--border);
}

/* ── titlebar ── */
#titlebar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 14px 18px 12px;
  -webkit-app-region: drag;
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.title-left { display: flex; align-items: center; gap: 9px; }
.title-icon {
  width: 28px; height: 28px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  border-radius: 8px;
  display: flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.title-text { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
.title-sub  { font-size: 10px; color: var(--muted); margin-top: 1px; }
#close-btn {
  -webkit-app-region: no-drag;
  width: 26px; height: 26px;
  background: var(--surface); border: none; border-radius: 7px;
  color: var(--muted); font-size: 13px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s;
}
#close-btn:hover { background: var(--accent); color: white; }

/* ── progress section ── */
#progress-section {
  padding: 14px 18px 10px;
  flex-shrink: 0;
}
.progress-header {
  display: flex; justify-content: space-between;
  align-items: baseline; margin-bottom: 8px;
}
.progress-header span:first-child { font-size: 11px; color: var(--muted); }
#progress-fraction { font-size: 20px; font-weight: 800; color: var(--text); }
#progress-fraction .denom { font-size: 13px; font-weight: 500; color: var(--muted); }

.progress-track {
  height: 4px; background: var(--surface);
  border-radius: 99px; overflow: hidden;
}
#progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--accent), var(--accent2));
  border-radius: 99px;
  transition: width 0.5s cubic-bezier(.4,0,.2,1);
  width: 0%;
}

/* ── done banner ── */
#done-banner {
  display: none;
  margin: 0 18px 10px;
  padding: 10px 14px;
  background: linear-gradient(135deg, rgba(34,197,94,0.12), rgba(34,197,94,0.04));
  border: 1px solid rgba(34,197,94,0.25);
  border-radius: 10px;
  font-size: 12px; font-weight: 600; color: var(--green);
  text-align: center;
}

/* ── task list ── */
#task-scroll {
  flex: 1; overflow-y: auto;
  padding: 4px 18px 8px;
}
#task-scroll::-webkit-scrollbar { width: 3px; }
#task-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

.empty-state {
  color: var(--muted); font-size: 12px;
  text-align: center; padding: 28px 0;
  line-height: 1.8;
}

.task-item {
  display: flex; align-items: flex-start; gap: 10px;
  padding: 10px 12px;
  border-radius: 10px;
  margin-bottom: 4px;
  background: var(--card);
  border: 1px solid transparent;
  transition: all 0.15s;
  cursor: pointer;
}
.task-item:hover { border-color: var(--border); }
.task-item.done { opacity: 0.38; }

.task-check {
  width: 18px; height: 18px; min-width: 18px;
  border-radius: 6px; border: 1.5px solid var(--muted);
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  margin-top: 1px; transition: all 0.15s; flex-shrink: 0;
}
.task-item.done .task-check {
  background: var(--accent); border-color: var(--accent);
}
.task-item.done .task-check::after { content: '✓'; font-size: 11px; color: white; font-weight: 700; }

.task-label {
  flex: 1; font-size: 12.5px; line-height: 1.5;
  font-weight: 500; color: var(--text);
}
.task-item.done .task-label { text-decoration: line-through; color: var(--muted); }

.task-del {
  background: none; border: none; color: var(--border);
  font-size: 14px; cursor: pointer; padding: 0; line-height: 1;
  align-self: center; transition: color 0.15s; flex-shrink: 0;
}
.task-del:hover { color: var(--accent); }

/* ── add input ── */
#add-section {
  padding: 8px 18px 10px;
  flex-shrink: 0;
  border-top: 1px solid var(--border);
}
#add-row {
  display: flex; gap: 8px; align-items: center;
}
#new-task {
  flex: 1; background: var(--surface);
  border: 1px solid var(--border); border-radius: 9px;
  color: var(--text); font-size: 12px; font-family: inherit;
  padding: 9px 12px; outline: none; transition: border-color 0.15s;
}
#new-task::placeholder { color: var(--muted); }
#new-task:focus { border-color: var(--accent); }
#add-btn {
  background: var(--accent); color: white; border: none;
  border-radius: 9px; font-size: 12px; font-weight: 700;
  font-family: inherit; padding: 9px 16px; cursor: pointer;
  transition: opacity 0.15s;
  white-space: nowrap;
}
#add-btn:hover { opacity: 0.85; }

/* ── action bar ── */
#actions {
  display: flex; gap: 8px;
  padding: 0 18px 14px;
  flex-shrink: 0;
}
.action-btn {
  flex: 1; background: var(--surface);
  border: 1px solid var(--border); border-radius: 9px;
  color: var(--muted); font-size: 11px; font-family: inherit;
  font-weight: 600; padding: 8px 10px; cursor: pointer;
  transition: all 0.15s; text-align: center;
}
.action-btn:hover { border-color: var(--accent); color: var(--accent); }

body { display: flex; flex-direction: column; }
</style>
</head>
<body>

<div id="titlebar">
  <div class="title-left">
    <div class="title-icon">🤖</div>
    <div>
      <div class="title-text">Study Buddy</div>
      <div class="title-sub">GATE DA · MA · 2027</div>
    </div>
  </div>
  <button id="close-btn">✕</button>
</div>

<div id="progress-section">
  <div class="progress-header">
    <span>Today's Progress</span>
    <span id="progress-fraction"><span id="done-count">0</span><span class="denom"> / <span id="total-count">0</span></span></span>
  </div>
  <div class="progress-track"><div id="progress-fill"></div></div>
</div>

<div id="done-banner">🎉 All tasks done for today. Go rest, you earned it.</div>

<div id="task-scroll"></div>

<div id="add-section">
  <div id="add-row">
    <input id="new-task" type="text" placeholder="Add a GATE task…" maxlength="100">
    <button id="add-btn">+ Add</button>
  </div>
</div>

<div id="actions">
  <button class="action-btn" id="btn-check">🔍 Check Now</button>
  <button class="action-btn" id="btn-pause">⏸ Pause 30m</button>
</div>

<script>
const { ipcRenderer } = require('electron');
let tasks = [];

async function load() {
  tasks = await ipcRenderer.invoke('load-tasks');
  render();
}

function render() {
  const scroll = document.getElementById('task-scroll');
  scroll.innerHTML = '';

  const done  = tasks.filter(t => t.done).length;
  const total = tasks.length;
  const pct   = total ? (done / total * 100) : 0;

  document.getElementById('done-count').textContent  = done;
  document.getElementById('total-count').textContent = total;
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('done-banner').style.display =
    (total > 0 && done === total) ? 'block' : 'none';

  if (!total) {
    scroll.innerHTML = `<div class="empty-state">No tasks yet.<br>Add what you need to study today ↓</div>`;
    return;
  }

  // undone first, done at bottom
  const sorted = [...tasks.map((t,i) => ({...t, _i:i}))].sort((a,b) => a.done - b.done);

  sorted.forEach(t => {
    const i = t._i;
    const row = document.createElement('div');
    row.className = 'task-item' + (t.done ? ' done' : '');

    const check = document.createElement('div');
    check.className = 'task-check';

    const label = document.createElement('div');
    label.className = 'task-label';
    label.textContent = t.text;

    const del = document.createElement('button');
    del.className = 'task-del';
    del.textContent = '✕';
    del.onclick = e => { e.stopPropagation(); tasks.splice(i, 1); save(); render(); };

    row.onclick = () => { tasks[i].done = !tasks[i].done; save(); render(); };
    row.append(check, label, del);
    scroll.appendChild(row);
  });
}

function save() { ipcRenderer.invoke('save-tasks', tasks); }

function addTask() {
  const el = document.getElementById('new-task');
  const text = el.value.trim();
  if (!text) return;
  tasks.push({ text, done: false, addedDate: new Date().toISOString().slice(0,10) });
  el.value = '';
  save(); render();
}

document.getElementById('add-btn').onclick = addTask;
document.getElementById('new-task').addEventListener('keydown', e => { if (e.key === 'Enter') addTask(); });
document.getElementById('close-btn').onclick  = () => ipcRenderer.invoke('close-todo');
document.getElementById('btn-check').onclick  = () => ipcRenderer.invoke('check-now');
document.getElementById('btn-pause').onclick  = () => ipcRenderer.invoke('pause', 30);

load();
</script>
</body>
</html>
